# k8s/platform/leaderboard-api/deployment.yaml
#
# This file declares Kubernetes resources for k8s/platform/leaderboard-api.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaderboard-api
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leaderboard-api
  template:
    metadata:
      labels:
        app: leaderboard-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: leaderboard-api
          image: ghcr.io/agrawalx/leaderboard-api:demo
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: leaderboard-api-secret
                  key: database-url
            - name: TIMESCALE_URL
              valueFrom:
                secretKeyRef:
                  name: leaderboard-api-secret
                  key: timescale-url
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: leaderboard-api-secret
                  key: kafka-brokers
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: leaderboard-api-secret
                  key: redis-addr
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: PROMETHEUS_URL
              value: http://prometheus.observability.svc:9090
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
