# k8s/platform/submission-api/deployment.yaml
#
# This file declares Kubernetes resources for k8s/platform/submission-api.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-api
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: submission-api
  template:
    metadata:
      labels:
        app: submission-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: submission-api
          image: ghcr.io/agrawalx/submission-api:demo
          ports:
            - containerPort: 8080
          env:
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: submission-api-secret
                  key: database-url
            - name: MINIO_ENDPOINT
              value: minio.data.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: submission-api-secret
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: submission-api-secret
                  key: minio-secret-key
            - name: MINIO_BUCKET
              value: submissions
            - name: MINIO_CREATE_BUCKET_IF_MISSING
              value: "true"
            - name: KAFKA_BROKERS
              value: kafka.data.svc.cluster.local:9092
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-api-secret
                  key: google-client-id
            - name: ENVIRONMENT
              value: prod
            - name: METRICS_PORT
              value: "8080"
            - name: CONSTANT_DURATION_S
              value: "60"
            - name: SPIKE_DURATION_S
              value: "60"
            - name: RAMP_DURATION_S
              value: "180"
            - name: CONSTANT_TOTAL_RPS
              value: "25000"
            - name: SPIKE_PEAK_RPS
              value: "50000"
            - name: RAMP_PEAK_RPS
              value: "90000"
            - name: RESEED_SCENARIOS
              value: "true"
            # Seed only the constant scenario. SeedScenarios never deletes, so
            # any pre-existing spike/ramp rows must be dropped once via SQL; they
            # are never re-created after that.
            - name: SEED_SCENARIOS
              value: "constant"
            # The identity an UNAUTHENTICATED submission is stamped with, used
            # only when AUTH_REQUIRED=false and no bearer token is present
            # (main.go:161 -> handler.OptionalContestant).
            #
            # Declared 2026-08-03 because the Go default and the frontend
            # DISAGREE: the API falls back to "e2e-contestant" while the
            # frontend's compiled-in default is "echo-contestant"
            # (frontend/src/config/platform.ts:53, baked at `next build` via
            # NEXT_PUBLIC_DEFAULT_CONTESTANT_ID — not runtime-configurable). With
            # them mismatched, the UI filters "my submissions" against an id the
            # API never writes, so every row renders as another contestant's.
            #
            # Observed on EKS: browser uploads landed as e2e-contestant while a
            # token-bearing client was devuser, and POST /benchmark answered
            # "submission not found" (owner-scoped 404, handler/submission.go:56)
            # until the identities were made to match.
            #
            # Set to the frontend's value because the frontend's is the one that
            # cannot be changed without rebuilding its image.
            - name: DEFAULT_CONTESTANT_ID
              value: "echo-contestant"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
        - name: tmp
          emptyDir: {}
