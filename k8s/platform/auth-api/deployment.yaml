# k8s/platform/auth-api/deployment.yaml
#
# This file declares Kubernetes resources for k8s/platform/auth-api.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: platform
  labels:
    app: auth-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: auth-api
          image: ghcr.io/agrawalx/auth-api:demo
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-api-secret
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-api-secret
                  key: google-client-secret
            - name: GOOGLE_ALLOWED_REDIRECT_URIS
              valueFrom:
                secretKeyRef:
                  name: auth-api-secret
                  key: google-allowed-redirect-uris
            - name: AUTH_COOKIE_SECURE
              value: "true"
            - name: AUTH_COOKIE_SAMESITE
              value: "lax"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
