# k8s/benchmark/bot-fleet/deployment.yaml
#
# This file declares Kubernetes resources for k8s/benchmark/bot-fleet.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-fleet-worker
  namespace: benchmark
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bot-fleet-worker
  template:
    metadata:
      labels:
        app: bot-fleet-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # Pin load generators to their dedicated, tainted botworker pool so they
      # don't crowd the measurement plane (Kafka/data) on the general nodes.
      nodeSelector:
        pool: botworker
      tolerations:
        - key: botworker
          operator: Exists
          effect: NoSchedule
      # The net-tune initContainer (MTU 1500 clamp + offloads off, privileged)
      # is GONE: CAPTURE_CAP is 9029 since 2026-08-01, so a full jumbo frame
      # (EKS default MTU 9001) fits one capture record and the load generator
      # no longer has to pay the ~6x packet-count tax to keep the capture
      # complete. Receiver side is unchanged and still required: the sandbox
      # nodes run the gro-disable DaemonSet, because GRO re-coalesces frames
      # up to 64KB regardless of MTU. See docs/capture-ringbuf-drops.md §6.2.
      containers:
        - name: bot-fleet-worker
          image: ghcr.io/agrawalx/bot-fleet:demo
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_BROKERS
              value: kafka.data.svc.cluster.local:9092
            - name: KAFKA_CONSUMER_GROUP
              value: bot-fleet
            - name: MAX_BOTS_PER_WORKER
              value: "1000"
            - name: TELEMETRY_BATCH_SIZE
              value: "1000"
            - name: MAX_POLL_INTERVAL_MS
              value: "1800000"
            # Closed-loop in-flight cap per task: bounds the pending map so a slow
            # contestant can't grow it unbounded (see worker.rs). The watchdog
            # (RESPONSE_TIMEOUT 5s) already caps REAL pending at rate x 5s — hft's
            # 1000/s x 5 = 5000 — so 10k never false-throttles. HARD worst case (all
            # tasks stalled at the cap): tasks/worker (<= MAX_TASKS_PER_WORKER=1000)
            # x 10000 x ~350 B ~= 3.5 GiB pending + 1 GiB kafka queue + ~0.5 GiB
            # runtime ~= 5 GiB — hence the 6Gi mem limit below (one worker per
            # c6i.xlarge / 8 GiB node). OOM is otherwise impossible: the kafka queue
            # BLOCKS at 1 GiB rather than growing.
            - name: BOT_MAX_INFLIGHT_PER_TASK
              value: "10000"
            # How many workload specs one worker executes CONCURRENTLY. Before this
            # existed the consume loop awaited each workload inline, so a pod ran one
            # shard at a time and two concurrent sessions landing on the same pod were
            # serialized regardless of how small their shards were.
            #
            # Sizing is bound by the same worst case as the memory limit above:
            #   MAX_CONCURRENT_WORKLOADS x (tasks x inflight x ~350 B) <= mem limit
            # At the EKS shard size (1000 tasks x 10k inflight ~= 3.5 GiB) only 2 fit
            # under the 6Gi limit. Raise only alongside the limit, or when shards are
            # known to be small (the local scenarios are ~200 tasks).
            - name: MAX_CONCURRENT_WORKLOADS
              value: "2"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "3"
              memory: 6Gi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
