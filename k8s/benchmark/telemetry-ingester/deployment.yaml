# k8s/benchmark/telemetry-ingester/deployment.yaml
#
# This file declares Kubernetes resources for k8s/benchmark/telemetry-ingester.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ingester
  namespace: benchmark
spec:
  replicas: 2
  strategy:
    # RollingUpdate is what has ALWAYS run: this block briefly held a duplicate
    # `type:` key (Recreate above RollingUpdate) and lenient YAML parsers took
    # the last value, so the Recreate edit was silently dead. The strict
    # kustomize renderer caught it (2026-08-02). If Recreate is ever wanted
    # (avoid two generations sharing the consumer group mid-rollout), change
    # it deliberately — with the lag spike that entails.
    type: RollingUpdate
  selector:
    matchLabels:
      app: telemetry-ingester
  template:
    metadata:
      labels:
        app: telemetry-ingester
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: telemetry-ingester
          image: ghcr.io/agrawalx/telemetry-ingester:demo
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: telemetry-ingester-secrets
                  key: KAFKA_BROKERS
            - name: TIMESCALE_URL
              valueFrom:
                secretKeyRef:
                  name: telemetry-ingester-secrets
                  key: TIMESCALE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: telemetry-ingester-secrets
                  key: REDIS_URL
            - name: KAFKA_CONSUMER_GROUP
              value: telemetry-ingester
            - name: INGESTER_SHARD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: info
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
      securityContext:
        runAsNonRoot: true
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-rollup
  namespace: benchmark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: telemetry-rollup
  template:
    metadata:
      labels:
        app: telemetry-rollup
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: telemetry-rollup
          image: ghcr.io/agrawalx/telemetry-ingester:demo
          command: ["/usr/local/bin/telemetry-rollup"]
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: TIMESCALE_URL
              valueFrom:
                secretKeyRef:
                  name: telemetry-ingester-secrets
                  key: TIMESCALE_URL
            - name: ROLLUP_INTERVAL_MS
              value: "1000"
            - name: RUST_LOG
              value: info
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      securityContext:
        runAsNonRoot: true
