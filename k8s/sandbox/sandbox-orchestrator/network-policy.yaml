# k8s/sandbox/sandbox-orchestrator/network-policy.yaml
#
# This file declares Kubernetes resources for k8s/sandbox/sandbox-orchestrator.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

# NOTE (2026-08-03, found on EKS): AWS VPC CNI's network-policy agent does NOT
# honour `ipBlock: 0.0.0.0/0` for CLUSTER-INTERNAL destinations — egress to the
# API server ClusterIP (and other in-cluster IPs) is dropped despite the
# catch-all rule, silently. Every such rule therefore lists the cluster CIDRs
# EXPLICITLY alongside 0.0.0.0/0: 172.20.0.0/16 (EKS service CIDR), 10.0.0.0/16
# (VPC/pod CIDR), 10.43.0.0/16 + 10.42.0.0/16 (k3s service/pod CIDRs). This was
# invisible locally because deploy-local's applynp() skips netpol files
# entirely, and on the previous EKS cluster because policy enforcement was off.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-orchestrator-egress
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      app: sandbox-orchestrator
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: benchmark
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              name: observability
      ports:
        - port: 8080
          protocol: TCP

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: observability
      ports:
        - port: 3100
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: 172.20.0.0/16
        - ipBlock:
            cidr: 10.0.0.0/16
        - ipBlock:
            cidr: 10.43.0.0/16
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # The slot READINESS DIAL (added 2026-08-03, found on EKS). slot.go TCP-dials
    # the contestant's port(s) to decide a slot is ready, and does so BEFORE it
    # creates the capture Job — so a blocked dial presents as "no capture pod,
    # session stuck in deploying", which is what `docs/eks-bringup-handoff.md` §7b
    # recorded as a ProtocolAll bug. It is not ProtocolAll: measured from inside
    # the orchestrator's netns, BOTH 9898 and 8080 timed out, on algo pods on two
    # different nodes in two AZs. Single-protocol submissions only appeared to work
    # because slot.go dials the EXTRA port, so a FIX-only slot performs no dial at
    # all and is declared ready without ever touching the contestant.
    #
    # Why nothing allowed it: `sandbox-isolation` already permits the INGRESS half
    # (algo pods accept `from podSelector app=sandbox-orchestrator`), but no policy
    # permitted the matching EGRESS. NetworkPolicy requires both ends, and the
    # orchestrator is itself in the sandbox namespace, so sandbox-isolation's
    # egress applies to it too — and its catch-all `0.0.0.0/0` EXCEPTs 10.0.0.0/8,
    # which is every pod IP. Union of both policies = dial denied.
    #
    # Scoped to the contestant ports only (9898 FIX, 8080 REST/WS) rather than a
    # blanket allow: the orchestrator legitimately dials every slot it manages, and
    # this mirrors sandbox-isolation's ingress rule, which already allows the
    # orchestrator to reach ALL sandbox pods. A podSelector with no
    # namespaceSelector is same-namespace only, so this grants nothing outside
    # sandbox. Per the header note, selector-based rules are used rather than
    # ipBlock, which the VPC CNI agent does not honour for cluster-internal IPs.
    - to:
        - podSelector:
            matchLabels:
              app: algo
      ports:
        - port: 9898
          protocol: TCP
        - port: 8080
          protocol: TCP
