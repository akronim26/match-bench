# k8s/data/kafka/topic-init-job.yaml
#
# This file declares Kubernetes resources for k8s/data/kafka.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: data
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: kafka-topic-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: kafka-topic-init
          image: apache/kafka:3.7.1
          command: ["/bin/bash", "-ec"]
          args:
            - |
              broker="kafka-0.kafka.data.svc.cluster.local:9092"
              # RF and min.insync default to 1: that is what a single-broker cluster can
              # satisfy, and this deployment runs one broker. They were hardcoded to 3 and
              # 2, which no single-broker cluster can ever meet -- and because
              # min.insync.replicas=2 on RF=1 makes EVERY produce fail with
              # NOT_ENOUGH_REPLICAS, creating a topic that way is worse than not creating
              # it. Override both for a real multi-broker cluster. Keep in step with
              # ensure_topics() in services/bot-fleet/src/kafka.rs, which reads the same
              # values from KAFKA_TOPIC_REPLICATION_FACTOR / KAFKA_MIN_INSYNC_REPLICAS.
              rf="${KAFKA_TOPIC_REPLICATION_FACTOR:-1}"
              insync="${KAFKA_MIN_INSYNC_REPLICAS:-1}"
              failed=0
              create_topic() {
                topic="$1"
                partitions="$2"
                retention_ms="$3"
                /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server "$broker" \
                  --create \
                  --if-not-exists \
                  --topic "$topic" \
                  --partitions "$partitions" \
                  --replication-factor "$rf" \
                  --config min.insync.replicas="$insync" \
                  --config retention.ms="$retention_ms" \
                  --config max.message.bytes=1048576
              }

              create_topic submission.build.requested 3 604800000 || failed=1
              create_topic submission.status.updated 3 604800000 || failed=1
              create_topic benchmark.requested 3 604800000 || failed=1
              # 4, not 3: partitions here bound VALIDATION parallelism (one
              # status partition per active validator group member), and the
              # true concurrent-run ceiling is 4 exclusive order bands
              # (24 partitions / width 6). Keep this >= the band count or the
              # last completing session's validation queues by construction.
              create_topic benchmark.status.updated 4 604800000 || failed=1
              create_topic workload.assignments 24 86400000 || failed=1
              create_topic barrier 3 86400000 || failed=1
              create_topic bot.ready 3 86400000 || failed=1
              create_topic workload.failed 3 604800000 || failed=1
              create_topic orders.sent 24 21600000 || failed=1
              create_topic orders.acked 24 21600000 || failed=1
              create_topic scores.correctness 3 2592000000 || failed=1
              create_topic leaderboard.updates 3 604800000 || failed=1
              exit "$failed"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-logs
              mountPath: /opt/kafka/logs
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-logs
          emptyDir: {}
