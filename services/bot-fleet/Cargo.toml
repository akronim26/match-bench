[package]
name = "iicpc-bot-fleet"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
futures = "0.3"
iicpc-logger-rust = { path = "../../libs/rust/logger" }
iicpc-schemas-rust = { path = "../../schemas/rust" }
# Build librdkafka from the vendored source so CI and developer machines do
# not need a matching system librdkafka.pc installed.
rdkafka = { version = "=0.36.0", default-features = false, features = ["cmake-build", "tokio", "zstd"] }
rand = { version = "0.8", features = ["small_rng"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
tokio = { version = "1.38", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus-client = "0.22.3"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "serialization"
harness = false
